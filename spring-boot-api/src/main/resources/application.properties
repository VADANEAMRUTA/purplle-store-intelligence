# Server configuration
server.port=8080

# Database configuration - Use file-backed H2 for persistence across restarts
spring.datasource.url=jdbc:h2:file:./data/storedb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Event log path
store.event.log.path=../event_log.jsonl

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# CORS - Allow dashboard origin for development
spring.web.cors.allowed-origins=http://localhost:8000,http://127.0.0.1:8000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Logging
# Alert configuration
store.max.capacity=50
store.overcrowd.threshold.percentage=80
store.critical.threshold.percentage=95
alert.notification.enabled=true
alert.sound.enabled=true

logging.level.org.springframework.web=DEBUG
logging.level.com.purplle=DEBUG