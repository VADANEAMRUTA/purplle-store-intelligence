<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Purplle Intelligence Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-Tm20GZ8Ht0D+XvE/OVfUzVrYw5Za3jKjUElq2LWDlePw3JDcYqqn4FiptyoWFeSeR5bgN+l0Myqi7dFbdc2/7w==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="init.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: radial-gradient(circle at top right, #6f42c1, transparent 18%), radial-gradient(circle at bottom left, #2196f3, transparent 20%), #08111f; color: #eef2ff; display: grid; place-items: center; }
    .auth-shell { width: min(520px, calc(100% - 32px)); padding: 32px; border-radius: 28px; background: rgba(10, 18, 36, 0.96); border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 35px 80px rgba(0, 0, 0, 0.3); }
    .auth-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 28px; }
    .auth-header h1 { margin: 0; font-size: 2rem; }
    .auth-header p { margin: 0; color: #b8c2d3; }
    .tabs { display: flex; gap: 10px; margin-bottom: 24px; }
    .tab { flex: 1; text-align: center; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.05); cursor: pointer; color: #d8e1f2; }
    .tab.active { background: linear-gradient(135deg, #8e44ad, #42a5f5); color: #fff; }
    form { display: grid; gap: 16px; }
    label { display: grid; gap: 6px; color: #cfd8e7; font-size: 0.95rem; }
    input, select { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); color: #f8fbff; }
    input::placeholder { color: rgba(248, 251, 255, 0.55); }
    button { border: none; border-radius: 16px; padding: 14px 18px; background: linear-gradient(135deg, #7b1fa2, #1e88e5); color: #fff; cursor: pointer; font-weight: 600; }
    .hint { color: #8ea4cc; font-size: 0.92rem; }
    .toast { border-radius: 18px; padding: 14px 18px; margin-top: 14px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14); color: #f8fbff; display: flex; justify-content: space-between; align-items: center; }
    .toast.success { border-left: 4px solid #4caf50; }
    .toast.error { border-left: 4px solid #f44336; }
    .toast button { background: transparent; border: none; color: rgba(255,255,255,0.7); font-size: 1.15rem; cursor: pointer; }
  </style>
</head>
<body>
  <main class="auth-shell">
    <div class="auth-header">
      <div>
        <h1>Purplle Intelligence</h1>
        <p>Secure access for manager, owner, security, and marketing teams.</p>
      </div>
      <div class="hint">Demo credentials available in the backend</div>
    </div>
    <div class="tabs">
      <div class="tab active" id="loginTab">Login</div>
      <div class="tab" id="registerTab">Register</div>
    </div>
    <form id="authForm">
      <label>Username
        <input type="text" id="username" autocomplete="username" placeholder="Enter your username" required />
      </label>
      <label>Password
        <input type="password" id="password" autocomplete="current-password" placeholder="Enter your password" required />
      </label>
      <div id="registerFields" style="display: none; gap: 16px;">
        <label>Full Name
          <input type="text" id="fullName" placeholder="Your full name" />
        </label>
        <label>Role
          <select id="role">
            <option value="manager">Manager</option>
            <option value="owner">Owner</option>
            <option value="security">Security</option>
            <option value="marketing">Marketing</option>
          </select>
        </label>
      </div>
      <button type="submit" id="submitBtn">Login</button>
    </form>
    <div id="toastContainer"></div>
  </main>
  <script src="login.js"></script>
</body>
</html>
